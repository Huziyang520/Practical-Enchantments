plugins {
	// 26.1-26.2 line: Loom 1.17.x (Gradle 9.4+) + ModDevGradle 2.0.141.
	// MDG 2.0.147 is only needed for 26.3 (its NFRT cannot recompile 26.3 sources); 26.1.2 builds on 2.0.141.
	id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
	id 'net.neoforged.moddev' version '2.0.141' apply false
}

allprojects {
	repositories {
		mavenLocal()
	}
}
