pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		// CurseGradle（de.maxhenkel.cursegradle）未发布到 Gradle 插件门户，走作者自有 Maven
		maven { url 'https://maven.maxhenkel.de/releases' }
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
			}
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'NeoForge'
					url = uri('https://maven.neoforged.net/releases')
				}
			}
			filter {
				includeGroupAndSubgroups('net.neoforged')
			}
		}
	}
}
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'practical-enchantments-multiloader'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
