plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom'
	id 'de.maxhenkel.cursegradle' version '1.5.2'
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
	implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
	// EnchantLib Fabric
	implementation "com.enchantlib:enchantlib-fabric-${minecraft_version}:${enchantlib_version}"
}

loom {
	def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
	if (aw.exists()) {
		accessWidenerPath.set(aw)
	}
	runs {
		configureEach {
			vmArg "-Dfabric.skipMcVersionCheck=true"
		}
		client {
			client()
			setConfigName('Fabric Client')
			ideConfigGenerated(true)
			runDir('runs/client')
		}
		server {
			server()
			setConfigName('Fabric Server')
			ideConfigGenerated(true)
			runDir('runs/server')
		}
	}
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
	configurations.matching { it.name == variant }.configureEach {
		attributes {
			attribute(loaderAttribute, 'fabric')
		}
	}
}

sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.matching { it.name == variant }.configureEach {
			attributes {
				attribute(loaderAttribute, 'fabric')
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// ─────────────────────────────────────────────────────────────────────────────
// CurseForge 一键推送（CurseGradle 1.5.2；插件不在 Gradle 门户，源见 settings.gradle）
// 【铁律】必须等用户实机测试通过并主动发指令后才允许执行，AI 不得自行上传。
// 执行（在本 26.2 目录）：gradlew :fabric:curseforge -Pcurse_release_type=<release|beta|alpha>
// releaseType 必须随版本号变更逐模组询问用户，再用 -Pcurse_release_type 传入；缺省 beta 仅兜底。
// API key 读 Gradle 属性 curseforge_api_key（用户全局配置；禁止写入仓库、禁止读取/打印该文件）。
curseforge {
	apiKey = project.findProperty('curseforge_api_key') ?: ''
	project {
		id = '1689525'
		changelogType = 'markdown'
		changelog = rootProject.file('curseforge-changelog.md')
		releaseType = project.findProperty('curse_release_type') ?: 'beta'
		// 本环境 Loom 1.16.3 的 dontRemapOutputs=true（运行时探针证实），不注册 remapJar，jar 即最终可发布产物
		mainArtifact(tasks.named('jar').get()) {
			displayName = "${mod_name} ${version} (Fabric) for Minecraft ${minecraft_version}"
		}
		addGameVersion minecraft_version
		addGameVersion 'Fabric'
		addGameVersion 'Client'
		addGameVersion 'Server'
	}
	options {
		javaIntegration = false
		forgeGradleIntegration = false
	}
}
// CurseGradle 不会自动为主产物挂任务依赖，上传前必须先构建
tasks.named('curseforge') { dependsOn 'jar' }
