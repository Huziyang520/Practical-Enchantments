# Project
version=1.5.0
group=com.practicalenchantments
java_version=25
# Common
# This branch covers 26.1 ~ 26.2 and compiles against the lower bound (26.1.2), so one jar runs on
# both versions. minecraft_version_slug is only used for artifact file names.
minecraft_version=26.1.2
minecraft_version_slug=26.1-26.2
mod_name=Practical Enchantments
mod_author=Huziyang520
mod_id=practical_enchantments
license=CC0-1.0
credits=
description=Practical, situational enchantments that are worth an inventory slot. | Feedback: https://github.com/Huziyang520/Practical-Enchantments/issues | Backup feedback: https://issue.mengcai.online/
minecraft_version_range=[26.1,26.3)
# neoForm version used by the common module (official mappings), lower bound of this branch
neo_form_version=26.1.2-1
# Fabric
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.18.6
# Optional Fabric config screens and Mod Menu: compile only, never bundled (26.1-26.2 line)
cloth_config_version=26.2.155
modmenu_version=20.0.3
# NeoForge
neoforge_version=26.1.2.94
# 26.1-26.2 still declare modLoader / loaderVersion in neoforge.mods.toml (26.3 dropped them)
neoforge_loader_version_range=[4,)
# MerlinLib dependency version
merlinlib_version=0.9.1
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
