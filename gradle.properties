# Important Notes:
# Every field used by META-INF/mods.toml / pack.mcmeta must also be listed in build.gradle's
# replaceProperties map, otherwise the placeholder is left unexpanded in the shipped jar.

# Project
version=1.6.1
group=com.practicalenchantments
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Practical Enchantments
mod_author=Huziyang520
mod_id=practical_enchantments
license=CC0-1.0
credits=
# Single line only. Expanded into mods.toml as a TOML basic string; a real newline makes the
# whole jar be rejected as "not a valid mod file".
description=Practical, situational enchantments that are worth an inventory slot. \\nFeedback: https://github.com/Huziyang520/Practical-Enchantments/issues | Backup feedback: https://issue.mengcai.online/
minecraft_version_range=[1.20.1, 1.21)

# Forge, see https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml
# 1.20.1 = the 47.x line. The test instance runs 47.4.20.
forge_version=47.4.26
forge_loader_version_range=[47,)

# MerlinLib dependency version. The library is a hard prerequisite at runtime (declared in
# mods.toml) and is only needed on the compile classpath, see build.gradle.
# 0.9.1 is the first release carrying LootInjectionBuilder#allowModdedTables, which the linked
# enchantments need for their own mod's chest tables.
merlinlib_version=1.0.0

# Gradle
# en locale + UTF-8 keep javac diagnostics readable in this shell.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
