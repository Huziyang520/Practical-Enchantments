plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

neoForge {
	neoFormVersion = neo_form_version
	// Automatically enable AccessTransformers if the file exists
	def at = file('src/main/resources/META-INF/accesstransformer.cfg')
	if (at.exists()) {
		accessTransformers.from(at.absolutePath)
	}
}

def overlaidJava = [
		'com/practicalenchantments/enchantment/support/DeathSaveSupport.java',
		'com/practicalenchantments/enchantment/support/TridentPullSupport.java',
		'com/practicalenchantments/enchantment/weapon/PenetrationEnchantment.java',
		'com/practicalenchantments/mixin/CubeMobSplitMixin.java'
]
def sharedJava = layout.buildDirectory.dir('shared/java')
def sharedResources = layout.buildDirectory.dir('shared/resources')

tasks.register('sharedJava', Sync) {
	from('../../../common/src/main/java') { overlaidJava.each { exclude it } }
	from('../overlay/java')
	into sharedJava
}

tasks.register('sharedResources', Sync) {
	from('../../../common/src/main/resources') { exclude 'practical_enchantments.mixins.json' }
	from('../overlay/resources')
	into sharedResources
}

tasks.named('compileJava') { dependsOn 'sharedJava' }
tasks.named('processResources') { dependsOn 'sharedResources' }

sourceSets {
	main {
		java {
			setSrcDirs([])
			srcDir sharedJava
		}
		resources {
			setSrcDirs([])
			srcDir sharedResources
		}
	}
}

dependencies {
	// MerlinLib common (compiled against; its implementation comes from the composite build)
	compileOnly "com.huziyang520.merlinlib:merlinlib-common-26.1-26.2:${merlinlib_version}"
	// Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
	compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava tasks.named('sharedJava')
	commonResources tasks.named('sharedResources')
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
	configurations.matching { it.name == variant }.configureEach {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}

sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.matching { it.name == variant }.configureEach {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

def packScript = file('../../../tools/validate_pack.py')

tasks.register('validatePack') {
	group = 'verification'
	inputs.files(fileTree('src/main/resources'))
	inputs.file(packScript)
	outputs.upToDateWhen { false }
	doLast {
		if (!packScript.exists()) {
			return
		}
		def python = System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3'
		def process
		try {
			process = new ProcessBuilder(python, packScript.absolutePath).redirectErrorStream(true).start()
		} catch (Exception ignored) {
			logger.warn('validatePack skipped: python not found')
			return
		}
		def output = process.inputStream.text
		if (process.waitFor() != 0) {
			throw new GradleException("datapack validation failed:\n" + output)
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('validatePack')
}
