// Practical Enchantments —— 1.21.1 编译目标（NeoForge 单端）。
//
// 源码来源：../../common（26.X 主线 common）经 Sync 到 build/shared，再与 overlay/ 合并。
// 版本强制差异全部落在 overlay/，不在这里写 if。
//
// 工艺：ModDevGradle 2.0.147 + Gradle 8.x + JDK 21。
// 1.20.5 起 NeoForge 跑在 Mojang 官方名上，所以这里既不需要 refmap，也不需要 Mixin 注解处理器。

plugins {
	id 'java'
	id 'net.neoforged.moddev' version '2.0.147'
}

base {
	archivesName = "${mod_id}-${version}-neoforge-${minecraft_version}"
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
	archiveVersion.set('')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven { name = 'AliyunPublic'; url = uri('https://maven.aliyun.com/repository/public') }
	maven { name = 'TencentPublic'; url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }
	maven { name = 'NeoForged'; url = uri('https://maven.neoforged.net/releases') }
}

// ---------------------------------------------------------------------------
// 共享源码：26.X common + overlay
// ---------------------------------------------------------------------------

