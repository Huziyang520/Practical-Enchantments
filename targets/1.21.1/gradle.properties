# Practical Enchantments —— 1.21.1 编译目标（NeoForge 单端）
#
# 结构：单模块。Java 与资源由 build.gradle 从 ../../common（即 26.X 主线 common）Sync 过来，
# 版本强制差异放 overlay/ 覆盖。这样 1.7.0 的内容只写一次（common），只有真正吃版本 API
# 的地方才落 overlay。
#
# 与 26.1-26.2 目标的区别：那条线是 common + fabric + neoforge 三模块（两个加载器都要）；
# 1.21.1 只有 NeoForge，所以不做模块拆分，直接单模块编译。

# Project
version=1.7.0
group=com.practicalenchantments
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_slug=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
mod_name=Practical Enchantments
mod_author=Huziyang520
mod_id=practical_enchantments
license=CC0-1.0
credits=
# 必须单行：该值会展开进 neoforge.mods.toml 的 TOML basic string。
# 键名用 mod_description 而不是 description：Gradle 已占用 Project#description。
mod_description=Practical, situational enchantments that are worth an inventory slot. | Feedback: https://github.com/Huziyang520/Practical-Enchantments/issues | Backup feedback: https://issue.mengcai.online/

# NeoForge
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# MerlinLib 依赖版本（1.21.1 的库目标产出 merlinlib-<v>-neoforge-1.21.1.jar）
merlinlib_version=1.1.0

# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false