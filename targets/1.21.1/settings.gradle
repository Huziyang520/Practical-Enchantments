pluginManagement {
	repositories {
		maven { name = 'AliyunGradlePlugin'; url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
		maven { name = 'AliyunPublic'; url = uri('https://maven.aliyun.com/repository/public') }
		maven { name = 'TencentPublic'; url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }
		gradlePluginPortal()
		mavenCentral()
		maven {
			name = 'NeoForged'
			url = uri('https://maven.neoforged.net/releases')
		}
	}
}

// 不用 toolchains resolver：构建直接用 JAVA_HOME 给的 JDK 21，不下载工具链。
rootProject.name = 'practical-enchantments-1.21.1'