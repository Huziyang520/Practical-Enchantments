plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	// jar 文件名 = <mod_id>-<version>-<loader>-<minecraft_version>
	// 例：enchantlib-1.2.2-neoforge-26.2.jar（2026-09-12 命名规则，见 文档/AI模组制作（通用文档）.md §4.13）
	archivesName = "${mod_id}-${version}-${project.name}-${minecraft_version}"
}

// Gradle 默认会在 archivesName 后再追加 -<version>；版本已含在 archivesName 里，
// 这里清空 archiveVersion 防止出现 "...-1.1.1-1.1.1.jar" 双版本号。
// remapJar（loom）继承 Jar 任务，同样被覆盖。
tasks.withType(Jar).configureEach {
	archiveVersion = ""
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
	// 按约定（2026-09-12）默认不再产出 -sources.jar / -javadoc.jar
}

// Java 25 的 javadoc 默认开启 doclint 严格校验，本项目源码注释为中文且并非所有成员都带
// @param/@return（例如 record、Mixin、枚举常量），doclint 会直接判错导致 javadoc 任务失败，
// 连带 publishToMavenLocal 也失败。这里统一关闭 doclint 并固定 UTF-8 源码编码。
tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
	options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Jar).configureEach {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${mod_name}" }
	}
}

jar {
	manifest {
		attributes([
			'Specification-Title'   : mod_name,
			'Specification-Vendor'  : mod_author,
			'Specification-Version' : project.jar.archiveVersion,
			'Implementation-Title'  : project.name,
			'Implementation-Version': project.jar.archiveVersion,
			'Implementation-Vendor' : mod_author,
			'Built-On-Minecraft'    : minecraft_version
		])
	}
}

processResources {
	var expandProps = [
		'version'                       : version,
		'group'                         : project.group,
		'minecraft_version'             : minecraft_version,
		'minecraft_version_range'       : minecraft_version_range,
		'fabric_version'                : fabric_version,
		'fabric_loader_version'         : fabric_loader_version,
		'mod_name'                      : mod_name,
		'mod_author'                    : mod_author,
		'mod_id'                        : mod_id,
		'license'                       : license,
		'description'                   : project.description,
		'neoforge_version'              : neoforge_version,
		'credits'                       : credits,
		'java_version'                  : java_version
	]
	var jsonExpandProps = expandProps.collectEntries { key, value ->
		[(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
	}
	filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
		expand expandProps
	}
	filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
		expand jsonExpandProps
	}
	inputs.properties(expandProps)
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			// maven 坐标保持不含版本号（<mod_id>-<loader>-<minecraft_version>），
			// 版本只体现在 jar 文件名与 version 属性里
			artifactId "${mod_id}-${project.name}-${minecraft_version}"
			from components.java
		}
	}
	repositories {
		maven {
			url System.getenv('local_maven_url') ?: uri('file:///C:/Users/HP/.m2/repository')
		}
	}
}