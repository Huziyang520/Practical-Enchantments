<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1600px; height:900px; overflow:hidden; position:relative;

      radial-gradient(560px 420px at 8% 92%, rgba(255,208,235,.5), transparent 70%),
      linear-gradient(150deg,#fdfbff 0%,#f0e9ff 38%,#e2e9ff 70%,#f6f2ff 100%); }
  .grid { position:absolute; inset:0; opacity:.5;

    background-size:32px 32px; mask-image:radial-gradient(circle at 55% 45%, #000 55%, transparent 92%); }
  .frame { position:absolute; inset:26px; border:1px solid rgba(122,92,190,.20); border-radius:26px; }
  .left { position:absolute; left:92px; top:126px; width:640px; }
  .kicker { display:inline-flex; align-items:center; gap:10px; font-size:14px; letter-spacing:.30em;
    text-transform:uppercase; color:#7a5abc; font-weight:600; }
  .kicker i { width:26px; height:2px; background:linear-gradient(90deg,#a97bff,#5fc8ff); display:block; border-radius:2px; }
  h1 { margin-top:20px; font-size:88px; line-height:.95; letter-spacing:-.03em; font-weight:800; }
  h1 .a { background:linear-gradient(100deg,#5b3cbe 0%,#8c53f5 46%,#2f93d8 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 .b { display:block; font-weight:300; letter-spacing:.02em; color:#43306f; font-size:76px; }
  .rule { margin:26px 0 22px; width:120px; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#a97bff,#5fc8ff); }
  .tag { font-size:21px; line-height:1.6; color:#5b4a86; width:560px; }
  .chips { margin-top:30px; display:grid; grid-template-columns:repeat(3, max-content); gap:10px; }
  .chip { font-size:14px; padding:8px 13px; border-radius:999px; background:rgba(255,255,255,.78);
    border:1px solid rgba(140,110,210,.25); color:#4d3a7c; box-shadow:0 6px 16px rgba(120,90,200,.10); }
  .stage { position:absolute; right:40px; top:70px; width:820px; height:760px; }
  .halo { position:absolute; left:190px; top:130px; width:470px; height:470px; border-radius:50%;
    background:radial-gradient(circle, rgba(167,122,255,.55), rgba(167,122,255,0) 68%); filter:blur(6px); }
  .shadow { position:absolute; left:236px; top:566px; width:390px; height:78px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(86,58,150,.30), rgba(86,58,150,0) 70%); filter:blur(4px); }
  .iso { position:absolute; left:120px; top:120px; width:700px; height:560px; }
  .iso svg { width:100%; height:100%; overflow:visible; }
  .float { position:absolute; image-rendering:pixelated; filter:drop-shadow(0 16px 22px rgba(70,40,130,.35)); }
  .book { width:158px; left:308px; top:22px; transform:rotate(-13deg); }
  .sword { width:158px; left:640px; top:206px; transform:rotate(26deg); }
  .bag { width:164px; left:34px; top:270px; transform:rotate(-8deg); }
  .amulet { width:126px; left:628px; top:414px; transform:rotate(9deg); }
  .fx { position:absolute; left:92px; bottom:96px; display:flex; align-items:center; gap:12px; }
  .fx .badge { display:flex; align-items:center; gap:9px; padding:8px 14px 8px 8px; border-radius:999px;
    background:rgba(255,255,255,.8); border:1px solid rgba(140,110,210,.22);
    box-shadow:0 8px 20px rgba(120,90,200,.10); font-size:14px; color:#4d3a7c; }
  .fx img { width:30px; height:30px; image-rendering:pixelated; }
  .fx .label { font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; color:#6f5c9c; font-weight:700; }
</style></head>
