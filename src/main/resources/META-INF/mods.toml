# Forge 1.20.1 mod metadata.
#
# Differences from the 26.3 neoforge.mods.toml:
#   * the file is META-INF/mods.toml (neoforge.mods.toml only exists from 1.20.6 onwards)
#   * the dependency key is `mandatory = true/false`, not `type = "required"`
#   * the icon field is `logoFile` (`iconFile` / `bannerFile` only exist from 26.2)
#   * there is no `[[mixins]]` block: Forge 1.20.1's ModFileParser does not know the key at all.
#     The mixin configuration is announced through the jar manifest's MixinConfigs attribute.
modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
credits="${credits}"
description="${description}"
logoFile="icon.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/practical-enchantments"
issueTrackerURL="https://github.com/Huziyang520/Practical-Enchantments/issues"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# MerlinLib is a hard prerequisite: every enchantment definition and event callback of this mod
# goes through its api. ordering=BEFORE so that MerlinLib's own registry work runs first.
[[dependencies.${mod_id}]]
    modId="merlinlib"
    mandatory=true
    versionRange="[${merlinlib_version},)"
    ordering="BEFORE"
    side="BOTH"
