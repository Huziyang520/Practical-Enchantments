# NeoForge 1.21.1 mod metadata.
#
# Differences from the 26.3 neoforge.mods.toml:
#   * modLoader / loaderVersion are mandatory on 1.21.1 (26.3 dropped them)
#   * the icon slot is logoFile (iconFile / bannerFile only exist from 26.2)
#   * the mixin configuration is announced with a [[mixins]] block, which ModFileParser reads on
#     1.21.1 through getMixinConfigs() - no jar manifest attribute is needed
#
# The dependency tables use a quoted key ([[dependencies."${mod_id}"]]) only so the unexpanded file
# is still valid TOML; after expansion it is [[dependencies."practical_enchantments"]], same table.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
credits = "${mod_credits}"
description = '''${mod_description}'''
# displayURL / issueTrackerURL / logoFile must stay inside the [[mods]] table, otherwise the mod
# list shows no homepage / issue button / icon at all.
logoFile = "practical_enchantments.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/practical-enchantments"
issueTrackerURL = "https://github.com/Huziyang520/Practical-Enchantments/issues"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# MerlinLib is a hard prerequisite: every enchantment definition and event callback of this mod
# goes through its api. ordering=BEFORE so that MerlinLib's own registry work runs first.
[[dependencies."${mod_id}"]]
modId = "merlinlib"
type = "required"
versionRange = "[${merlinlib_version},)"
ordering = "BEFORE"
side = "BOTH"
